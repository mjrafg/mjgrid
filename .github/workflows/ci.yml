name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sh scripts/gate.sh
      - run: npm pack --dry-run
